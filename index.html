<script>
    const owner = "girardf";
    const repo = "Interactive";
    const branch = "main";

    const apiURL =
        `https://api.github.com/repos/${owner}/${repo}/contents/?ref=${branch}`;

    const container = document.getElementById("projects");

    fetch(apiURL)
        .then(response => {
            if (!response.ok) {
                throw new Error("Could not access the GitHub repository.");
            }
            return response.json();
        })
        .then(items => {

            // Only keep directories
            const folders = items
                .filter(item => item.type === "dir")
                .sort((a, b) => a.name.localeCompare(b.name));

            container.innerHTML = "";

            if (folders.length === 0) {
                container.innerHTML =
                    '<div class="error">No interactive objects found.</div>';
                return;
            }

            folders.forEach(folder => {

                const link = document.createElement("a");

                link.className = "project";

                // Go directly to the Data/index.html inside each project
                link.href =
                    `./${encodeURIComponent(folder.name)}/Data/`;

                const title = document.createElement("h2");
                title.textContent = folder.name;

                const description = document.createElement("p");
                description.textContent = "Open interactive model →";

                link.appendChild(title);
                link.appendChild(description);

                container.appendChild(link);
            });
        })
        .catch(error => {
            console.error(error);

            container.innerHTML =
                `<div class="error">
                    Unable to load the interactive objects.<br>
                    ${error.message}
                </div>`;
        });
</script>
